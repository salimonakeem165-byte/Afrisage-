<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfriSage Preview Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#080808;padding:22px;text-align:center;border-bottom:2px solid #c99b35}
h1{color:#d8ad4d;margin:0}
main{max-width:650px;margin:35px auto;padding:20px}
.card{background:#1c1c1c;padding:24px;border-radius:12px}
label{display:block;margin-top:20px;margin-bottom:8px;color:#e2c77f}
input,select{width:100%;padding:13px;border-radius:6px;border:1px solid #555;background:#292929;color:white}
button{width:100%;padding:14px;margin-top:20px;background:#d5a63e;color:#111;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.message{margin-top:18px;padding:12px;border-radius:6px;background:#292929;line-height:1.5}
.small{color:#bbb;font-size:13px;line-height:1.5}
a{color:#e4bd61}
</style>
</head>
<body>

<header>
<h1>AfriSage</h1>
<p>First-Page Preview Manager</p>
</header>

<main>
<div class="card">
<h2>Add a Book Preview</h2>
<p class="small">Select one of your published books and upload an image of its first page. This will not create a new book submission.</p>

<div id="loginArea">
<label>Email address</label>
<input type="email" id="email" placeholder="Your registered email">

<label>Password</label>
<input type="password" id="password" placeholder="Your password">

<button id="loginBtn" onclick="login()">Sign In</button>
</div>

<div id="manager" style="display:none">
<p id="welcome"></p>

<label>Select your published book</label>
<select id="bookSelect">
<option value="">Loading your books...</option>
</select>

<label>Upload first-page preview image</label>
<input type="file" id="previewFile" accept="image/jpeg,image/png,image/webp">

<p class="small">Use JPG, PNG or WebP. Maximum file size: 5 MB.</p>

<button id="saveBtn" onclick="savePreview()">Save Preview</button>
<button onclick="logout()" style="background:#444;color:white">Sign Out</button>
</div>

<div id="message" class="message" aria-live="polite">Sign in to continue.</div>
</div>

<p class="small" style="text-align:center">
<a href="books.html">Return to Bookstore</a>
</p>
</main>

<script>
const SUPABASE_URL = "https://hwepbiptkyyclolujwss.supabase.co";
const SUPABASE_KEY = "sb_publishable_r224RF354eCJGM0qs_bJ5g_t084YO8_";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

function message(text){
 document.getElementById("message").textContent = text;
}

async function login(){
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;
 const button = document.getElementById("loginBtn");

 if(!email || !password){
  message("Enter your email address and password.");
  return;
 }

 button.disabled = true;
 message("Signing in...");

 const {data,error} = await db.auth.signInWithPassword({email,password});

 button.disabled = false;

 if(error){
  message("Sign-in failed: " + error.message);
  return;
 }

 currentUser = data.user;
 await showManager();
}

async function showManager(){
 document.getElementById("loginArea").style.display = "none";
 document.getElementById("manager").style.display = "block";
 document.getElementById("welcome").textContent = "Signed in as " + currentUser.email;

 message("Loading your published books...");

 const {data,error} = await db
  .from("books")
  .select("id,title,preview_path")
  .eq("author_id",currentUser.id)
  .eq("status","published")
  .order("created_at",{ascending:false});

 const select = document.getElementById("bookSelect");
 select.innerHTML = "";

 if(error){
  message("Could not load your books: " + error.message);
  return;
 }

 if(!data || data.length === 0){
  select.innerHTML = '<option value="">No published books found</option>';
  message("You have no published books available for preview updates.");
  return;
 }

 select.innerHTML = '<option value="">Choose a book</option>';

 data.forEach(book=>{
  const option = document.createElement("option");
  option.value = book.id;
  option.textContent = book.title + (book.preview_path ? " — Preview added" : " — No preview yet");
  select.appendChild(option);
 });

 message("Your published books are ready. Select one to add its first-page preview.");
}

async function savePreview(){
 const bookId = document.getElementById("bookSelect").value;
 const file = document.getElementById("previewFile").files[0];
 const button = document.getElementById("saveBtn");

 if(!bookId){
  message("Please select a published book.");
  return;
 }

 if(!file){
  message("Please choose a first-page image.");
  return;
 }

 const allowed = ["image/jpeg","image/png","image/webp"];

 if(!allowed.includes(file.type)){
  message("Please use a JPG, PNG or WebP image.");
  return;
 }

 if(file.size > 5 * 1024 * 1024){
  message("The image must not exceed 5 MB.");
  return;
 }

 button.disabled = true;
 message("Uploading your preview image...");

 const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path = currentUser.id + "/preview_" + Date.now() + "_" + safeName;

 const {error:uploadError} = await db.storage
  .from("book-covers")
  .upload(path,file,{upsert:false,contentType:file.type});

 if(uploadError){
  button.disabled = false;
  message("Image upload failed: " + uploadError.message);
  return;
 }

 message("Image uploaded. Saving it to your book...");

 const {error:updateError} = await db
  .from("books")
  .update({preview_path:path})
  .eq("id",bookId)
  .eq("author_id",currentUser.id);

 if(updateError){
  button.disabled = false;
  message("The image uploaded, but the book could not be updated: " + updateError.message);
  return;
 }

 document.getElementById("previewFile").value = "";
 button.disabled = false;

 message("Success! Your first-page preview has been added. Open the Bookstore and select your book to check it.");
 await showManager();
}

async function logout(){
 await db.auth.signOut();
 currentUser = null;
 document.getElementById("manager").style.display = "none";
 document.getElementById("loginArea").style.display = "block";
 message("You have signed out.");
}

async function checkSession(){
 const {data} = await db.auth.getSession();

 if(data.session){
  currentUser = data.session.user;
  await showManager();
 }
}

checkSession();
</script>
</body>
</html>
