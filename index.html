<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10100e">
<title>AfriSage — Where Stories Live</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#10100e;--panel:#191916;--gold:#d7ad55;--cream:#f5efdf;--muted:#b7b1a3;--line:#39372e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.6 system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,.btn{display:inline-block;border:0;border-radius:30px;padding:12px 18px;background:var(--gold);color:#17140d;font-weight:700;cursor:pointer}
header,footer{border-bottom:1px solid var(--line);padding:16px}
header .wrap,footer .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{font-size:1.4rem;font-weight:900}
.brand span,.eyebrow{color:var(--gold)}
nav{display:flex;gap:16px;flex-wrap:wrap}
.wrap{max-width:1050px;margin:auto;padding:0 18px}
.hero{padding:55px 0;display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}
.hero h1{font:clamp(2.5rem,6vw,4.5rem)/1.05 Georgia,serif}
.hero em{color:var(--gold)}
.art,.box,.feature{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.art{text-align:center;font:8rem Georgia;color:var(--gold)}
.section{padding:30px 0}
.muted,.notice{color:var(--muted)}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box h3{margin-top:0}
label{display:block;margin:10px 0 5px;color:var(--muted)}
input,select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#10100e;color:var(--cream)}
.box button{margin-top:14px}
.status{color:var(--gold);margin-top:10px;overflow-wrap:anywhere}
.notice{font-size:.82rem}
.hidden{display:none!important}
.sample{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel)}
footer{border-top:1px solid var(--line);border-bottom:0;margin-top:35px;color:var(--muted)}
@media(max-width:700px){.hero,.forms{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<div
